<style>
/* ---------- Sistema de diseño (v1.2.0) ----------
   Colores en tono arcilla del logo. Todo color, espacio, radio y sombra sale de estos tokens. */
:root{
  color-scheme:light;
  /* color */
  --bg:#f5f7fa; --card:#ffffff; --sheet:#f0f3f7; --field:#fff; --ink:#1d2733; --mut:#5d6b7a; --line:#e1e7ee; --line2:#cdd6e0;
  --pri:#24476b; --pri-tx:#24476b; --pri-on:#fff; --pri2:#e4edf6; --pri2-line:#c6d7e8; --hdr:#24476b; --hdr-tx:#fff;
  --warn:#8f4508; --warnbg:#fcefd4; --bad:#a3191b; --badbg:#fde3df; --ok:#2c7139; --okbg:#e7f4ea;
  --toast:#1d2733; --toast-tx:#fff; --scrim:rgba(29,39,51,.45);
  /* espacio */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* radios */
  --r1:8px; --r2:12px; --r3:16px; --r4:22px; --rp:999px;
  /* sombras */
  --sh1:0 1px 2px rgba(74,45,28,.05),0 2px 6px rgba(74,45,28,.06);
  --sh2:0 10px 30px rgba(74,45,28,.18);
  /* tipografía: Roboto en Android, San Francisco en iPhone, Segoe en Windows */
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:24px;
  --lh:1.45;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151b; --card:#18212b; --sheet:#141c25; --field:#131a22; --ink:#e8eef4; --mut:#9fb0c2; --line:#26313d; --line2:#334252;
  --pri:#3d77ad; --pri-tx:#93c2ea; --pri-on:#fff; --pri2:#1c2b3a; --pri2-line:#2d4459; --hdr:#172330; --hdr-tx:#e8f1f8;
  --warn:#f2c27b; --warnbg:#3a2b14; --bad:#f4a5a2; --badbg:#3e1d1c; --ok:#93d3a1; --okbg:#1c3223;
  --toast:#e8eef4; --toast-tx:#10151b; --scrim:rgba(0,0,0,.6);
  --sh1:0 1px 2px rgba(0,0,0,.35); --sh2:0 10px 30px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151b; --card:#18212b; --sheet:#141c25; --field:#131a22; --ink:#e8eef4; --mut:#9fb0c2; --line:#26313d; --line2:#334252;
    --pri:#3d77ad; --pri-tx:#93c2ea; --pri-on:#fff; --pri2:#1c2b3a; --pri2-line:#2d4459; --hdr:#172330; --hdr-tx:#e8f1f8;
    --warn:#f2c27b; --warnbg:#3a2b14; --bad:#f4a5a2; --badbg:#3e1d1c; --ok:#93d3a1; --okbg:#1c3223;
    --toast:#e8eef4; --toast-tx:#10151b; --scrim:rgba(0,0,0,.6);
    --sh1:0 1px 2px rgba(0,0,0,.35); --sh2:0 10px 30px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-md)/var(--lh) var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{transition:background-color .2s}
b,strong{font-weight:650}
.num,.prog b,.verlink small{font-variant-numeric:tabular-nums}
/* íconos SVG */
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.hic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r1);background:var(--pri2);color:var(--pri-tx);flex:none}
.hic .ic{width:18px;height:18px}
/* encabezado */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4) 10px;background:var(--hdr);color:var(--hdr-tx);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.brand{font-weight:750;font-size:var(--fs-lg);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.82;letter-spacing:.01em}
#splash{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash img{width:min(80vw,420px)}
#splash h1{margin:6px 0 0;font:800 30px/1.1 var(--font);color:#24476b;letter-spacing:-.3px}
#splash p{color:#5d6b7a;font-size:var(--fs-sm);margin-top:var(--s4);letter-spacing:.3px}
#splash.out{opacity:0;pointer-events:none}
.welcome img{display:block;width:62%;max-width:260px;margin:0 auto 10px;border-radius:var(--r2)}
#who{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:var(--rp);padding:4px 10px 4px 4px;background:rgba(255,255,255,.16);color:inherit;font:inherit;font-weight:600;font-size:var(--fs-sm);min-height:36px}
#who .av{width:28px;height:28px;font-size:13px;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
#who.solo{padding:4px 8px}
.sync{font-size:var(--fs-xs);text-align:center;padding:var(--s1);color:var(--mut)}
main{padding:var(--s2) var(--s3) 96px;max-width:720px;margin:0 auto}
/* barra inferior */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;box-shadow:0 -2px 12px rgba(29,39,51,.06)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font:inherit;font-size:11px;font-weight:500;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav button .ic{width:24px;height:24px}
nav button.on{color:var(--pri-tx);font-weight:700}
nav button.on .ic{stroke-width:2.2}
/* tarjetas y títulos */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s3) var(--s4);margin:10px 0;box-shadow:var(--sh1)}
h2{font-size:var(--fs-xl);font-weight:750;letter-spacing:-.015em;line-height:1.2;margin:var(--s5) 2px var(--s1);display:flex;align-items:center;gap:var(--s2)}
main > h2:first-child{margin-top:var(--s3)}
h3{font-size:var(--fs-md);font-weight:700;letter-spacing:-.005em;line-height:1.25;margin:0;display:flex;align-items:center;gap:var(--s2)}
.card > h3,.card > .row > h3{margin-bottom:var(--s1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.muted{color:var(--mut);font-size:var(--fs-sm);margin:var(--s1) 0}
.sub{color:var(--mut);font-size:var(--fs-xs);margin:2px 0 6px}
/* personas: avatares */
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;letter-spacing:-.02em;flex:none;line-height:1}
.avs{display:inline-flex;flex:none}
.avs .av + .av{margin-left:-8px;box-shadow:0 0 0 2px var(--card)}
.pp{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--ink);white-space:nowrap;border:0;background:none;padding:0;font-family:inherit;vertical-align:middle}
button.pp{border:1px solid var(--line);background:var(--card);border-radius:var(--rp);padding:3px 10px 3px 3px;min-height:34px}
button.pp .ic{width:14px;height:14px;color:var(--mut);margin-left:-2px}
.pp.v{flex-direction:column;gap:2px;font-size:11px;padding:4px 2px;border-radius:var(--r1);width:100%;min-height:0}
.pp.v .av{width:26px;height:26px;font-size:12px}
.who-pick{display:flex;gap:var(--s2);flex-wrap:wrap;margin:6px 0}
.who-pick button{display:flex;align-items:center;gap:var(--s2);border:1.5px solid var(--line);background:var(--card);border-radius:var(--rp);padding:4px 14px 4px 4px;font:inherit;font-weight:600;color:var(--ink);min-height:44px}
.who-pick button .av{width:34px;height:34px;font-size:14px}
.who-pick button.on{border-color:var(--pri);background:var(--pri2)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:650;background:var(--pri2);color:var(--pri-tx)}
.tag.w{background:var(--warnbg);color:var(--warn)}
.tag.b{background:var(--badbg);color:var(--bad)}
.item{display:flex;align-items:center;gap:10px;padding:var(--s2) 0;border-top:1px solid var(--line);min-height:44px}
.item:first-of-type{border-top:0}
.item{flex-wrap:wrap}
.item .t{flex:1 1 150px;min-width:0}
.item .t ~ .b.sm:first-of-type{margin-left:auto}
.item .t div:first-child{font-weight:600}
.item .meta,.meta{font-size:var(--fs-xs);color:var(--mut)}
.done-tx{text-decoration:line-through;color:var(--mut)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
button.b,.btns button{border:1px solid var(--line2);background:var(--card);border-radius:var(--r2);padding:8px 12px;font:inherit;font-size:var(--fs-sm);font-weight:500;color:var(--ink);min-height:38px}
button.pri,.btns button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-on);font-weight:650}
button.sm{padding:5px 10px;font-size:var(--fs-xs);min-height:32px}
button.b.on{background:var(--pri);border-color:var(--pri);color:var(--pri-on)}
button.dani-on{background:#db2777;border-color:#db2777;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.dsel button{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:var(--r2);font:inherit;font-size:var(--fs-sm);min-height:44px;padding:0}
.dsel button.on{background:var(--pri);color:var(--pri-on);border-color:var(--pri);font-weight:650}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chips button{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:var(--rp);padding:6px 12px;font:inherit;font-size:var(--fs-sm);white-space:nowrap;min-height:36px}
.chips button.on{background:var(--pri);color:var(--pri-on);border-color:var(--pri)}
details summary{cursor:pointer;color:var(--pri-tx);font-size:var(--fs-sm);font-weight:650;padding:6px 0}
.steps{display:flex;gap:6px;margin-top:var(--s2)}
.steps button{flex:1;border:1.5px dashed var(--line2);border-radius:var(--r2);background:var(--card);color:var(--ink);padding:8px 4px;font:inherit;font-size:var(--fs-xs);line-height:1.2;min-height:48px}
.steps button.done{border:1.5px solid var(--ok);background:var(--okbg);color:var(--ok)}
.steps button.next{border:1.5px solid var(--pri);background:var(--pri2);font-weight:700}
.steps small{display:block;font-size:10px;color:var(--mut);font-weight:400}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:var(--r2);padding:6px 3px;text-align:center;font-size:11px;background:var(--card);min-width:0}
.day.today{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.day b{display:block;font-size:var(--fs-sm)}
.day .lbl{color:var(--mut);font-size:10px;margin-top:var(--s1)}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:var(--r2);padding:8px 10px;font-size:var(--fs-sm);margin-top:var(--s2)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;padding:7px 11px;border-radius:var(--r3);background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--pri2);border-color:var(--pri2-line)}
.msg .meta{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;margin-bottom:2px}
.msg .meta .av{width:18px;height:18px;font-size:9px}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:var(--s2) var(--s3);background:var(--bg);border-top:1px solid var(--line);max-width:720px;margin:0 auto}
.composer input{flex:1}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r2);padding:9px 10px;font:inherit;background:var(--field);color:var(--ink);min-height:42px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--pri-tx);outline-offset:2px}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:var(--fs-xs)}
label.f{display:block;font-size:var(--fs-xs);color:var(--mut);margin:10px 0 3px;font-weight:500}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--sheet);color:var(--ink);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:var(--r4) var(--r4) 0 0;padding:var(--s4) var(--s4) calc(20px + env(safe-area-inset-bottom));box-shadow:var(--sh2)}
.sheet h3{font-size:var(--fs-lg);margin-bottom:6px}
.sheet h3.sec{font-size:var(--fs-md);margin-top:var(--s4)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--toast);color:var(--toast-tx);padding:9px 14px;border-radius:var(--r2);font-size:var(--fs-sm);opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90%;box-shadow:var(--sh2)}
#toast.on{opacity:.96}
.log{font-size:var(--fs-sm);padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.log:first-child{border-top:0}
.log .av{margin-top:1px}
.big{font-size:22px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.credit{text-align:center;color:var(--mut);font-size:var(--fs-xs);margin:18px 0}
.newsv{border-top:1px solid var(--line);padding:10px 0 4px}
.newsv:first-of-type{border-top:0}
.newsv h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.newsv h4 span{font-weight:400;color:var(--mut);font-size:var(--fs-xs)}
.newsv ul{margin:4px 0 6px;padding-left:20px}
.newsv li{margin:3px 0;font-size:14px}
.newsv.cur{background:var(--pri2);border-radius:var(--r2);padding:10px 12px;border-top:0}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.prog .bar{flex:1;height:12px;margin:0}
.prog b{font-size:var(--fs-xl);color:var(--pri-tx);white-space:nowrap}
.verlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r3);padding:10px 14px;margin:10px 0;font:inherit;color:var(--pri-tx);min-height:44px}
.verlink .bar{flex:1;margin:0}
.verlink small{color:var(--mut);font-size:var(--fs-xs);white-space:nowrap}
.install{border-color:var(--pri2-line);background:var(--pri2)}
.howto{padding-left:22px;margin:6px 0}
.howto li{margin:6px 0}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;margin:6px 0}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:var(--fs-sm);padding:9px 4px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.seg button + button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--pri);color:var(--pri-on);font-weight:650}
.seg .ic{width:16px;height:16px}
/* ---------- v1.3.0: movimiento, festejo, hojas deslizables y estados vacíos ---------- */
/* barra inferior: indicador animado y globitos */
nav{display:block}
#navbtns{display:flex;position:relative;z-index:1}
#navind{position:absolute;top:6px;height:32px;width:56px;border-radius:var(--rp);background:var(--pri2);left:calc((100% / var(--n,5)) * (var(--i,0) + .5) - 28px);transition:left .32s cubic-bezier(.3,1.35,.5,1),opacity .2s;pointer-events:none}
nav button .nic{position:relative;display:grid;place-items:center;height:32px;width:56px}
.badge{position:absolute;top:-1px;right:7px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--rp);background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--card);animation:bpop .35s cubic-bezier(.3,1.6,.5,1)}
:root[data-theme="dark"] .badge{background:#c4473f}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge{background:#c4473f} }
@keyframes bpop{from{transform:scale(.3)}to{transform:scale(1)}}
/* tilde animada */
@keyframes tick{0%{transform:scale(1)}35%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--pri2-line)}100%{box-shadow:0 0 0 12px transparent}}
.pop{animation:tick .42s cubic-bezier(.3,1.5,.5,1),glow .6s ease-out}
.item.pop,.card.pop{animation:glow .7s ease-out}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* confeti */
#confeti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#confeti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.95}
/* hojas modales: entran deslizando y se cierran tirando hacia abajo */
.sheet{position:relative;padding-top:6px;animation:sheetin .28s cubic-bezier(.2,.9,.3,1);touch-action:pan-y;overscroll-behavior:contain}
.sheet.drag{transition:none!important;animation:none}
.sheet.back{transition:transform .22s cubic-bezier(.2,.9,.3,1)}
.modal{transition:background-color .2s}
.grab{display:block;width:44px;height:5px;border-radius:var(--rp);background:var(--line2);margin:2px auto 12px;border:0;padding:0;cursor:grab}
.grabzone{display:flex;justify-content:center;padding:6px 0 4px;margin:-6px 0 0}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
/* estados vacíos */
.empty{text-align:center;padding:var(--s4) var(--s3) var(--s3)}

/* ---------- v1.10.0: precios y total estimado ---------- */
.spend .bar{height:8px;border-radius:99px;background:var(--pri-tx);opacity:.35;margin:4px 0 2px}.spend .nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.spend .nav button{min-width:44px;min-height:44px}.spend .srow{margin:8px 0}.spend .srow>div:first-child{display:flex;justify-content:space-between;gap:8px}

/* ---------- v1.4.0: accesibilidad, deshacer, botón + y anillos de progreso ---------- */
button.b,.btns button{min-height:44px;min-width:44px}
.btns a.btn{display:inline-flex;align-items:center;border:1px solid var(--line2);background:var(--card);border-radius:var(--r2);padding:8px 12px;font-size:var(--fs-sm);font-weight:500;color:var(--ink);min-height:44px;text-decoration:none}

.chips button,.seg button,details summary{min-height:44px}

input[type=text],input[type=tel],input[type=number],input[type=date],select{min-height:44px}

/* tamaño de letra grande (⚙ Ajustes → Apariencia) */
:root[data-big="1"]{--fs-xs:14px;--fs-sm:16px;--fs-md:18px;--fs-lg:20px;--fs-xl:23px;--fs-2xl:27px}

/* aviso con «Deshacer» */
#toast{display:flex;align-items:center;gap:var(--s3);bottom:calc(140px + env(safe-area-inset-bottom));width:max-content}

#toast.on{opacity:1}
/* botón flotante + */
.fab{position:fixed;right:var(--s4);bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-on);box-shadow:var(--sh2);display:grid;place-items:center;z-index:4;animation:bpop .3s cubic-bezier(.3,1.6,.5,1);padding:0}

/* anillos de progreso */
.rings{display:flex;justify-content:space-around;gap:var(--s2);margin-top:var(--s2)}
.ringw{display:flex;flex-direction:column;align-items:center;gap:var(--s1);font-size:var(--fs-xs);color:var(--mut);font-weight:600;min-width:0}
.ring{width:76px;height:76px}

@keyframes ringin{from{stroke-dashoffset:var(--c)}}
/* ---------- v1.5.0: buscador, voz, cantidades, categorías e historial ---------- */
.search{display:flex;gap:var(--s2);margin:var(--s2) 0 2px}

.qty{font-weight:650;color:var(--pri-tx);white-space:nowrap}
.brand{font-weight:500;color:var(--mut);font-size:var(--fs-sm)}

.pform{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pform .pthumb{width:64px;height:64px}
.cat{font-size:var(--fs-xs);font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:10px 0 2px;border-top:1px solid var(--line)}
.cat + .item{border-top:0}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:var(--s2)}
.two > div{min-width:0}
textarea.plain{font-family:inherit;font-size:var(--fs-md);min-height:72px}
.mic{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:56px;font-size:var(--fs-md);font-weight:650;margin:var(--s2) 0;color:var(--pri-tx)}
.mic.on{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:glow 1.2s ease-out infinite}
.histd .log:first-of-type{border-top:0}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }.sharepre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.9rem;max-height:40vh;overflow:auto;background:var(--sheet);border-radius:12px;padding:10px 12px;margin:8px 0}

/* ---------- v1.20.0: estética renovada (pedido de Gonzalo 22/11). Solo capa de estilo: misma paleta azul marino y Poppins. ---------- */
:root{--r3:20px;--sh1:0 1px 2px rgba(20,40,70,.04),0 6px 18px -6px rgba(20,40,70,.10);--bg:#eef2f7;--line:#e6ebf1}

header{background:linear-gradient(135deg,#1d3a59 0%,#24476b 55%,#2f5b86 100%);border-radius:0 0 22px 22px;padding:14px 16px 14px;box-shadow:0 8px 24px -12px rgba(20,40,70,.55)}

.sync{margin-top:2px}
.card{border:0;box-shadow:var(--sh1);padding:14px 16px}
:root[data-theme="dark"] .card{border:1px solid var(--line)}
h2{font-size:18px;margin:26px 4px 6px}
h2 .hic{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pri2),#fff);box-shadow:inset 0 0 0 1px var(--pri2-line)}
:root[data-theme="dark"] h2 .hic{background:var(--pri2)}
h3 .hic{border-radius:10px}
.item{border-top:1px solid var(--line);padding:10px 0}
.card > .item:first-of-type,.card > h3 + .item,.card > .row + .item{border-top:0}
button.b,.btns button{border-radius:var(--rp);padding:8px 14px;transition:transform .12s,background-color .2s,box-shadow .2s}
button.b:active,.btns button:active{transform:scale(.97)}

.tag{border-radius:var(--rp);padding:2px 9px}

/* desplegable de turnos médicos */
details.fold > summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:52px}

.day.fer{background:var(--pri2)}

.ferbox{background:linear-gradient(135deg,#e4edf6,#fff);cursor:pointer}
:root[data-theme="dark"] .ferbox{background:var(--pri2)}
.ferbox p{margin:6px 0 0}
.brand{color:#fff}.brand small{color:rgba(255,255,255,.8)}


/* ---------- v1.28.0: botones renovados (jerarquía clara: principal, secundario, agregar, descartar) ---------- */
button{-webkit-tap-highlight-color:transparent;transition:transform .08s ease,background-color .15s ease,box-shadow .15s ease,border-color .15s ease}

#sheetbox .btns:not(.col) button:not(.pri):not(.add):last-child:not(:only-child){background:transparent;border-color:var(--line2);color:var(--mut);font-weight:500}
#sheetbox .btns{position:sticky;bottom:-1px;margin:var(--s4) calc(var(--s4) * -1) 0;padding:var(--s3) var(--s4);background:var(--sheet);border-top:1px solid var(--line);z-index:2}
#sheetbox .btns button.pri{flex:1 1 auto;min-height:48px;font-size:var(--fs-md)}
.item .b.ok{align-self:center}
.subs{flex:1 1 100%;display:flex;flex-direction:column;gap:2px;margin:0 0 4px 4px}

@media (prefers-reduced-motion:reduce){button{transition:none}button:active:not(:disabled){transform:none}}

<body>
<div id="splash" onclick="this.classList.add('out')"><img src="cover.jpg" alt=""><h1>Carga Mental</h1><p>Compartida, no invisible</p></div>
<header>
  <div class="brand"><img src="icon-192.png" alt=""><div>Carga Mental<small>Compartida, no invisible</small></div></div>
  <button id="who" onclick="A.settings()" aria-label="Ajustes">⚙</button>
</header>
<div id="sync" class="sync" role="status"></div>
<main id="main"></main>
<nav id="nav" aria-label="Secciones"><span id="navind" aria-hidden="true"></span><div id="navbtns"></div></nav>
<button id="fab" class="fab" type="button" hidden></button>
<div id="modal" class="modal hidden" onclick="if(event.target===this)A.close()"><div class="sheet" id="sheetbox" role="dialog" aria-modal="true" tabindex="-1"><div class="grabzone"><button class="grab" onclick="A.close()" aria-label="Cerrar (o deslizá hacia abajo)"></button></div><div id="sheet"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============ Constantes ============ */
const VERSION = '1.32.0';
const SCHEMA = 7; // versión de la estructura de datos guardados (ver MIGRATIONS)
/* Novedades: la primera es la versión actual. "hechas" = ítems del plan de 100 tildados hasta esa versión. */
const NEWS = [
  {v:'1.32.0', d:'2026-11-27', hechas:49, items:['Guardias: en «🔁 Turnos y guardias» de una tarea de Gonzalo podés tildar «Si estoy de guardia, la hace Dani ese día». Los lunes, los viernes y los martes con guardia de noche, esa tarea aparece en Hoy a nombre de Dani con el aviso «cubre por la guardia de Gonzalo». Cuando Dani la marca como hecha se anota una «deuda» amable y en Hoy aparece «🤝 Dani cubrió 1 tarea por tus guardias» con el botón «Devolví una» para compensar otro día.']},
  {v:'1.31.0', d:'2026-11-27', hechas:48, items:['Rotación de responsables: debajo de cada tarea hay un botón «🔁 Turnos». Elegís quién la hace esta semana y «Alternar cada semana»: la app cambia sola de Gonzalo a Dani (o al revés) cada lunes, así nadie tiene que acordarse de pasársela al otro. Al tocar el nombre de la persona en una tarea con turnos se abre esa misma hoja. Se puede dejar de alternar cuando quieras.']},
  {v:'1.30.0', d:'2026-11-27', hechas:47, items:['Posponer una tarea: debajo de cada tarea hay un botón «⏰ Posponer» con «Mañana», «En 3 días», «En una semana» o una fecha a elección. Mientras está pospuesta no figura como «toca» ni aparece en Hoy, se ve «pospuesta hasta…» y, cuando llega la fecha, vuelve sola. Se puede quitar la postergación y tiene «Deshacer». Marcar «Hecho» también la limpia.']},
  {v:'1.29.0', d:'2026-11-27', hechas:46, items:['Subtareas: cualquier tarea que se repite o de una sola vez puede tener una lista de pasos (por ejemplo «Llevar el auto al service»: pedir turno, juntar los papeles, llevarlo). Tocá «＋ Subtareas» debajo de la tarea para armarla; cada paso se tilda con un toque y se ve el avance (2/3). En las tareas que se repiten, al tocar «Hecho» los pasos vuelven a empezar. Tus tareas de siempre no cambian.']},
  {v:'1.28.0', d:'2026-11-27', hechas:45, items:['Botones renovados y más fáciles de entender: «Hecho» ahora es un botón azul con tilde ✓ para que se vea cuál es la acción principal, los botones de agregar («+ Nueva tarea», «+ Tarea de una vez») ocupan todo el ancho con borde punteado, «✕» es un botón redondo discreto y todos responden al toque con un pequeño hundimiento. Los botones de las hojas (Guardar, Crear) son más grandes y quedan fijos abajo.']},
  {v:'1.27.0', d:'2026-11-27', hechas:45, items:['Tareas de una sola vez con fecha límite: al crear una tarea elegí «Una sola vez (con fecha límite)» y, si querés, la fecha (por ejemplo, llevar el auto al service el viernes). En Casa aparecen en «Para hacer una vez», ordenadas por fecha y con «vence en 2 días» o «vencida»; en Hoy aparecen cuando faltan 3 días o menos, o ya pasó la fecha. Tocá el nombre para cambiar el texto o la fecha, «Hecho» para cerrarla (con «Deshacer») y «✕» para borrarla. Tus tareas de siempre no cambian.']},
  {v:'1.26.0', d:'2026-11-27', hechas:44, items:['Tareas en días fijos: al crear una tarea podés elegir «Días fijos de la semana» (por ejemplo lunes, miércoles y viernes). Esos días aparece como «toca» y, si queda sin hacer, sigue pendiente hasta que alguien la marque. Tocando el nombre de cualquier tarea que se repite podés pasarla a días fijos, o volver a «cada X días». Tus tareas de siempre no cambian.']},
  {v:'1.25.0', d:'2026-11-27', hechas:43, items:['Ropa de la semana de Joaco: en la pestaña Joaco hay un dibujo de lunes a viernes con la ropa de cada día (gimnasia o uniforme de calle). Tocá un día para cambiarlo y con «Editar» cambiás las prendas, los colores y las fechas de clases para el año que viene. En Hoy aparece qué ropa va mañana.']},
  {v:'1.24.0', d:'2026-11-27', hechas:43, items:['Ropa de Joaco aparte: en Casa, dentro de las tareas diarias, hay una tarea nueva «Ropa de Joaco» con tres etapas (uniforme, ropa de educación física y en la mochila) para dejar todo listo para el día. En Hoy aparece qué falta apenas se empieza. Tus datos quedan como estaban: solo se suma la tarea (y si la borrás, no vuelve).']},
  {v:'1.23.0', d:'2026-11-26', hechas:42, items:['Ropa: ahora podés tener varias cargas a la vez. En Casa, «+ Otra carga» suma una carga más con sus propias etapas (lavar, colgar, doblar, guardar); cada una se completa por separado y en Hoy aparece lo que falta de cada una.']},
  {v:'1.22.0', d:'2026-11-24', hechas:41, items:['El estado del lavavajillas se ve en Hoy: «Vacío y guardado», «Cargando: falta encenderlo» o «Limpio, falta guardar», con el botón para pasar a la etapa que sigue.']},
  {v:'1.21.0', d:'2026-11-23', hechas:40, items:['Cada producto tiene ahora «Nota de calidad» (ej.: gallinas alimentadas a maíz) y «Dónde comprarlo» (ej.: el naturista de la esquina). Se ven en la lista de compras con ⭐ y 📍, el buscador los encuentra y la nota de calidad viaja en el mensaje al negocio. Los huevos nuevos arrancan con su nota de maíz.']},
  {v:'1.20.1', d:'2026-11-22', hechas:39, items:['Los turnos médicos de Joaco ya no aparecen en «Te toca» ni suman al numerito de la pestaña Joaco: quedan solo en el desplegable «Turnos médicos».']},
  {v:'1.20.0', d:'2026-11-22', hechas:39, items:['Casa reordenada: «Tareas diarias» (lavavajillas, ropa con lavarropas y sacar la basura), «Orden de la casa» (cocina y habitaciones por separado) y «Otras tareas que se repiten». Al crear una tarea elegís la sección.','Sale «Fertilizar el limonero».','Turnos médicos: ya no está en «Quién se encarga de qué»; ahora es un desplegable en la pestaña Joaco que al abrirse muestra todos los controles. Se sumó Fonoaudiología.','Calendario de feriados en la pestaña Joaco, con el próximo feriado y aviso en Hoy el día anterior. Los feriados que caen en tus días de guardia figuran como trabajados, y si caen lunes, como guardia de 24 h. Esos días Joaco no tiene clases.','Estética renovada: encabezado con degradé, tarjetas más limpias y botones redondeados.']},
  {v:'1.19.0', d:'2026-11-22', hechas:39, items:['Marca o variedad preferida: al editar un producto hay un campo «Marca o variedad preferida» (por ejemplo, «La Serenísima entera» o «Yerba Playadito») y, si querés, una foto para reconocerlo en la góndola (sacada con la cámara o elegida de la galería). La marca aparece en la lista, en el buscador y en el mensaje que se manda al negocio; la foto, en la lista de compras.','Tus datos quedan como estaban: marca y foto son opcionales y arrancan vacías. Las fotos se achican solas para no ocupar lugar.']},
  {v:'1.18.0', d:'2026-11-21', hechas:38, items:['Compartir de más formas: al tocar «📲 Mandar lista» (o «Mandar indicaciones» a Daniela) se abre una hoja con tres opciones: «WhatsApp» (como antes, directo a quien corresponde), «Compartir…» (el menú de Android, para mandarlo por cualquier app) y «Copiar texto» (para pegarlo donde quieras). El mensaje es el mismo en las tres.']},
  {v:'1.17.0', d:'2026-11-20', hechas:37, items:['Snacks de Joaco: en la pestaña Joaco hay una tarjeta «🍎 Snacks de la semana» con el snack de cada día, de lunes a viernes. «Armar rotación» los reparte para que no se repita el mismo dos días seguidos y la semana siguiente sigue desde donde quedó. Tocá un día para cambiarlo a mano y en «Opciones» editás la lista de snacks que le gustan.','Tus datos quedan como estaban: la lista arranca con ideas comunes que podés cambiar.']},
  {v:'1.16.0', d:'2026-11-20', hechas:36, items:['Ideas y antojos: al final de Compras hay una lista aparte para lo que no es urgente (un queso nuevo, una idea para el cumpleaños de Joaco). Anotá con el campito y «Sumar»; cuando se anime alguien, «A la lista» lo pasa al negocio que elijas. No cuenta como pendiente ni molesta en Hoy.','Tus datos quedan como estaban: solo se suma la lista de ideas, vacía al principio.']},
  {v:'1.15.0', d:'2026-11-19', hechas:35, items:['«No había»: si en el negocio no encontraste algo, tocá «🚫 No había» en ese producto. Podés dejar una nota («tenían solo el grande») y, si querés, pasarlo a otro negocio para reintentar ahí. Queda marcado «No había en … (fecha)» para que nadie lo busque de nuevo en el mismo lugar. Al comprarlo, la marca se limpia sola.']},
  {v:'1.14.0', d:'2026-11-18', hechas:34, items:['«Lo traigo yo»: en la lista de cada negocio, cada producto tiene el botón «🙋 Lo traigo yo». Queda anotado «Lo trae Dani» (o Gonzalo) en el producto y a esa persona le aparece en «Hoy» lo que se comprometió a traer. Si cambian los planes, «Ya no lo traigo» lo libera. Al comprarlo o sacarlo de la lista, se limpia solo.']},
  {v:'1.13.0', d:'2026-11-17', hechas:33, items:['Día fijo de pedido: en cada negocio tocá «📅 Día de pedido» y elegí qué día de la semana lo hacen (por ejemplo, el súper los domingos). El negocio muestra «Se pide los domingos» y, el día anterior y ese mismo día, el recordatorio aparece en «Hoy» para quien se encarga, con cuántos productos hay anotados.']},
  {v:'1.12.1', d:'2026-11-16', hechas:32, items:['Links a la web de cada negocio: en Compras, cada negocio tiene un botón «🌐 Abrir web» que lo abre en el navegador. MercadoLibre ya viene con su dirección; en Berardi y el súper tocá «🔗 Poner web» y pegá el enlace de tu pedido (se guarda y se comparte con todos).']},
  {v:'1.12.0', d:'2026-11-17', hechas:31, items:['Plantillas de pedido: en cada negocio hay un botón «📋 Plantillas» con pedidos armados de antemano (Súper semanal, MercadoLibre mensual, Berardi quincenal). Con «Armar pedido» pasás todos sus productos a la lista de una vez, con «Deshacer».','Podés editarlas, crear las tuyas o guardar la lista de ese momento como plantilla nueva. Tus datos quedan como estaban: solo se suman las plantillas.']},
  {v:'1.11.0', d:'2026-11-16', hechas:30, items:['Gasto del mes: al final de Compras hay un resumen de cuánto se gastó en cada negocio, con los precios que quedaron en el historial al marcar como comprado. Con las flechas ‹ › mirás otros meses.','Solo suma las compras con precio cargado; si alguna no lo tenía, el resumen te avisa cuántas quedaron afuera.']},
  {v:'1.10.0', d:'2026-11-15', hechas:29, items:['Precios: en cada producto podés anotar cuánto costó el último pedido. Cada negocio muestra arriba el «Total estimado» de lo que hay en la lista (y cuántos productos tienen precio), también en el modo «Estoy en el negocio».','Al marcar algo como comprado, el precio queda en su historial. No hace falta cargarlos todos: el total suma los que tienen precio.']},
  {v:'1.9.1', d:'2026-11-14', hechas:28, items:['Se sacó el último resto de marrón (la sombra de la barra de abajo).']},

function spendOf(y, m){
  const by = {}, t = {sum:0, n:0, sin:0};
  Object.values(S.items).forEach(i => histOf(i).forEach(x => {
    const d = new Date(+x.at); if(!(+x.at > 0) || d.getFullYear() !== y || d.getMonth() !== m) return;

function parseCfg(txt){
  const m = String(txt).match(/\{[\s\S]*\}/); if(!m) throw new Error('No encontré la configuración');
  let j = m[0].replace(/\/\/.*$/gm,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');

async function connect(){
  const raw = localStorage.getItem(LS.cfg), code = localStorage.getItem(LS.code);
  if(!raw || !code) { syncState = 'local'; renderSync(); return; }
  syncState = 'conectando'; renderSync();
  try{
    const cfg = JSON.parse(raw);
    for(const p of ['app','auth','firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${p}-compat.js`);
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    await firebase.auth().signInAnonymously();
    const db = firebase.firestore();
    try { await db.enablePersistence({synchronizeTabs:true}); } catch(e) {}
    fs = db;
    for(const col of COLS){
      // Primera vez: si la nube está vacía subo lo local; si no, la nube manda.
      let snap = null;
      try { snap = await remotePath(col).get({source:'server'}); } catch(e) {}
      if(snap){
        if(snap.empty){ if(col !== 'log') Object.values(S[col]).forEach(o => remotePath(col).doc(o.id).set(clean(o))); }
        else { S[col] = {}; snap.forEach(d => S[col][d.id] = d.data()); }
      }
      let first = true;
      remotePath(col).onSnapshot(sn => {
        sn.docChanges().forEach(ch => {
          if(ch.type === 'removed'){ delete S[col][ch.doc.id]; return; }
          const d = ch.doc.data(); S[col][ch.doc.id] = d;
          if(!first && !ch.doc.metadata.hasPendingWrites && d.by && d.by !== me){
            if(col === 'log') notify(`${M[d.by]?.n || d.by}`, d.act);
            if(col === 'msgs') notify(`💬 ${M[d.by]?.n || d.by}`, d.text);
          }
        });
        first = false; save(); render();
      }, e => { syncState = 'error'; renderSync(); console.warn(e); });
    }
    for(let v = 1; v <= SCHEMA; v++) MIGRATIONS[v](S); syncState = 'nube'; save(); render();
  }catch(e){ console.warn(e); syncState = 'error'; renderSync(); }
}
async function notify(title, body){

  try { const r = await navigator.serviceWorker.ready; r.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png', tag:'cm-'+Date.now()}); }
  catch(e) { new Notification(title, {body}); }
}

  const t = theme(), root = document.documentElement;
  if(t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const meta = document.querySelector('meta[name=theme-color]'); if(meta) meta.content = dark ? '#172330' : '#24476b';

if(window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch(e) {}

   mientras no existe se usan estos valores, así que no hace falta migración ni se pierde nada. */
const UNI_DEF = {id:'uniforme', dias:{1:'gim',2:'calle',3:'gim',4:'gim',5:'calle'}, inicio:'', fin:'',
  tipos:{gim:{n:'Gimnasia', arriba:'Remera amarilla', abajo:'Pantalón bordó', pies:'Zapatillas blancas', chomba:false, c:['#e8b520','#8c1529','#f7f7f5']},

function uni(){ const u = S.checks.uniforme; if(!u) return JSON.parse(JSON.stringify(UNI_DEF));
  const d = JSON.parse(JSON.stringify(UNI_DEF)); return Object.assign(d, u, {tipos:Object.assign(d.tipos, u.tipos || {}), dias:Object.assign(d.dias, u.dias || {})}); }

function uniClases(d){ const u = uni(), k = dk(d); return (!u.inicio || k >= u.inicio) && (!u.fin || k <= u.fin); }
function uniSvg(t){ const [a, b, z] = t.c, bo = 'stroke="#00000026" stroke-width="1.2" stroke-linejoin="round"';
  const cuello = t.chomba ? `<path d="M25 9l5 6 5-6" fill="none" stroke="${b === '#8a8e93' ? '#7a1020' : b}" stroke-width="4" stroke-linecap="round"/><path d="M30 15v7" stroke="#00000030"/>` : `<path d="M25 9q5 5 10 0" fill="none" stroke="#00000030" stroke-width="1.5"/>`;
  const puno = t.chomba ? `<path d="M9 27l5 3M51 27l-5 3" stroke="#7a1020" stroke-width="3"/>` : '';
  return `<svg viewBox="0 0 60 112" class="uni-svg" aria-hidden="true">
    <path d="M22 8l-14 7-4 12 10 4 2-5v26h28V26l2 5 10-4-4-12-14-7q-8 7-16 0z" fill="${a}" ${bo}/>${cuello}${puno}
    <path d="M16 54h28l2 40h-11l-5-30-5 30H14z" fill="${b}" ${bo}/>
    <path d="M12 98h17l1 7H9q0-5 3-7zM31 98h17q3 2 3 7H30z" fill="${z}" ${bo}/></svg>`; }
function uniWeekHtml(){

    ${j && j.fer ? `<div class="item"><span>${P('joaco')}</span><div class="t meta">Feriado (${esc(j.fer[0])}): no hay clases</div></div>` : j ? `<div class="item"><span>${P('joaco')}</span><div class="t meta">Lo lleva ${P(j.lleva)} · lo busca ${P(j.busca)}</div></div>${j.warn.length ? `<div class="warnbox">⚠ ${j.warn.join(' · ')}. Cambialo en la pestaña Joaco.</div>` : ''}` : ''}

/* v1.22.0 (ítem 41): estado del lavavajillas a partir de las etapas de la tarea t_lava (Cargar, Encender, Guardar). */
function lavaState(t){
  const cur = t.cur || {}, n = t.steps.length, done = t.steps.map((_, i) => !!cur[i]), k = done.findIndex(x => !x), cnt = done.filter(Boolean).length;
  if(!cnt) return {txt:'Vacío y guardado', ico:'✨', k:0};
  if(k < 0) return {txt:'Listo', ico:'✨', k:0};
  if(n === 3 && done[1] && !done[2]) return {txt:'Limpio, falta guardar', ico:'🍽️', k:2};
  if(n === 3 && done[0] && !done[1]) return {txt:'Cargando: falta encenderlo', ico:'🫧', k:1};
  return {txt:'En marcha: falta ' + t.steps[k].toLowerCase(), ico:'🫧', k};
}
function lavaCard(){
  const t = S.tasks.t_lava; if(!t || t.kind !== 'cycle' || !Array.isArray(t.steps) || !t.steps.length) return '';
  const st = lavaState(t), busy = Object.keys(t.cur || {}).length > 0;

}

  ['gonzalo', 'dani'].forEach(w => { const l = Object.values(S.items).filter(i => bringer(i) === w).sort((a, b) => a.name.localeCompare(b.name)); if(l.length) todo.push({own:w, html:`🙋 Lo traés vos: <b>${l.map(i => esc(i.name)).join(', ')}</b>`, go:"A.go('compras')"}); });
  sorted('tasks').forEach(t => {
    if(onceSoon(t)) todo.push({own:effOwner(t), html:`📌 ${esc(t.name)} <span class="meta">· ${onceTxt(t)}${effOwner(t) !== t.owner ? ' · cubre Dani por la guardia de Gonzalo' : ''}</span>`, btn:`<button class="b sm ok" onclick="A.onceDone('${t.id}')">Hecho</button>`});
    if(t.kind === 'rec' && recDue(t)) todo.push({own:effOwner(t), html:`${t.icon} ${esc(t.name)} <span class="meta">· ${ago(t.last)}${effOwner(t) !== t.owner ? ' · cubre Dani por la guardia de Gonzalo' : ''}</span>`, btn:`<button class="b sm ok" onclick="A.recDone('${t.id}')">Hecho</button>`});
    if(t.kind === 'cycle'){ const k = t.steps.findIndex((_, i) => !(t.cur || {})[i]); if(Object.keys(t.cur || {}).length) todo.push({own:t.owner, html:`${t.icon} ${esc(t.name)}: falta <b>${esc(t.steps[k].toLowerCase())}</b>`, btn:`<button class="b sm" onclick="A.step('${t.id}',${k})">${esc(t.steps[k])}</button>`}); (t.more || []).forEach((L, li) => { const kk = t.steps.findIndex((_, i) => !(L.cur || {})[i]); if(kk >= 0) todo.push({own:t.owner, html:`${t.icon} ${esc(t.name)}, carga ${li + 2}: falta <b>${esc(t.steps[kk].toLowerCase())}</b>`, btn:`<button class="b sm" onclick="A.stepL('${t.id}',${li},${kk})">${esc(t.steps[kk])}</button>`}); }); }
  });
  if(favorN() > 0) todo.push({own:'gonzalo', html:`🤝 Dani cubrió <b>${favorN()}</b> tarea${favorN() > 1 ? 's' : ''} por tus guardias. Cuando puedas, devolvele una`, btn:`<button class="b sm ok" onclick="A.favorPay()">Devolví una</button>`});
  /* v1.20.1 (pedido de Gonzalo): los turnos médicos ya no aparecen en «Te toca»; se ven en el desplegable de la pestaña Joaco. */
  if(j && !j.fer){ const c = S.checks.mochila, done = c.date === dk() ? Object.keys(c.done).length : 0; if(done < c.list.length) todo.push({own:j.lleva, html:`🎒 Mochila de Joaco ${done}/${c.list.length}`, go:`A.go('joaco')`}); }
  const pend = Object.values(S.indic).filter(n => !n.done).length;
  if(S.checks.daniela?.next && daysTo(S.checks.daniela.next) >= 0 && daysTo(S.checks.daniela.next) <= 2) todo.push({own:S.checks.daniela.coord, html:`🧹 Daniela viene ${fdate(S.checks.daniela.next)} · ${pend} indicaciones`, go:`A.go('casa')`});
  return todo;
}

}

function vJoaco(){
  const today = new Date(), mon = monday(today); mon.setDate(mon.getDate() + (weekOffset + ([0,6].includes(today.getDay()) ? 1 : 0))*7);
  const w = weekCfg(mon), monStr = dk(mon);
  let h = `<h2>${hic('joaco')} Joaco · ${esc(M.joaco.r)}</h2>
  <div class="card"><div class="row"><button class="b sm" onclick="A.week(-1)" aria-label="Semana anterior">◀</button><h3>Semana del ${mon.getDate()}/${mon.getMonth()+1}</h3><button class="b sm" onclick="A.week(1)" aria-label="Semana siguiente">▶</button></div>
  <div class="week" style="margin-top:8px">`;
  const warns = [];
  for(let i = 0; i < 5; i++){
    const d = new Date(mon); d.setDate(d.getDate() + i); const j = joacoDay(d), ds = dk(d);
    j.warn.forEach(x => warns.push(`${DOW[d.getDay()]}: ${x}`));
    if(j.fer){ const gt = gFeriado(d); h += `<div class="day fer ${ds === dk() ? 'today' : ''}"><b>${DOW[d.getDay()]} ${d.getDate()}</b><div class="ferl">Feriado</div><div class="lbl">${esc(j.fer[0])}</div>${gt ? `<div class="lbl${/trabaja/.test(gt) ? ' warn-t' : ''}">${esc(/24 h/.test(gt) ? 'Gonzalo: guardia de 24 h' : /trabaja/.test(gt) ? 'Gonzalo de guardia' : gt)}</div>` : ''}</div>`; continue; }
    h += `<div class="day ${ds === dk() ? 'today' : ''}"><b>${DOW[d.getDay()]} ${d.getDate()}</b>
      <div class="lbl">Lleva</div>${PV(j.lleva, `A.cycleJ('${ds}','lleva')`, 'Lleva')}
      <div class="lbl">Busca</div>${PV(j.busca, `A.cycleJ('${ds}','busca')`, 'Busca')}
      ${j.warn.length ? '<div style="color:var(--warn)" role="img" aria-label="Hay un aviso">⚠</div>' : ''}</div>`;

  h += `</div>${warns.length ? `<div class="warnbox">⚠ ${warns.join('<br>⚠ ')}</div>` : ''}
  <label class="item" style="margin-top:8px"><input type="checkbox" ${w.tueNight ? 'checked' : ''} onchange="A.tueNight('${monStr}')"><div class="t">Gonzalo tiene guardia el martes de noche</div></label>
  <div class="sub">Dani va a la oficina:</div><div class="legend">${[1,2,3,4,5].map(x => `<button class="b sm${(w.office || []).includes(x) ? ' dani-on' : ''}" aria-pressed="${(w.office || []).includes(x)}" onclick="A.office('${monStr}',${x})">${DOW[x]}</button>`).join('')}</div>
  <details><summary>Semana tipo (base)</summary><p class="muted">Lo que se repite todas las semanas. Lo de arriba es solo para esta semana.</p>${[1,2,3,4,5].map(x => { const b = S.weeks.base.days[x]; return `<div class="item"><div class="t">${DOWL[x]}</div><span class="meta">lleva</span>${PB(b.lleva, `A.setBase(${x},'lleva')`)}<span class="meta">busca</span>${PB(b.busca, `A.setBase(${x},'busca')`)}</div>`; }).join('')}</details></div>`;

  h += uniWeekHtml();
  const c = S.checks.mochila, done = c.date === dk() ? c.done : {}, n = Object.keys(done).length;
  h += `<div class="card"><div class="row"><h3>${hic('mochila')} Mochila y ropa</h3><button class="b sm" onclick="A.mochilaEdit()">Editar</button></div>
    <div class="bar"><i style="width:${Math.round(100*n/Math.max(1,c.list.length))}%"></i></div>
    ${c.list.map((x, i) => `<label class="item"><input type="checkbox" class="${pc('m:' + i).trim()}" ${done[i] ? 'checked' : ''} onchange="A.mochila(${i})"><div class="t"><div>${esc(x)}</div>${done[i] ? `<div class="meta">${esc(M[done[i]]?.n)}</div>` : ''}</div></label>`).join('')}
    <div class="sub">Se reinicia cada día.</div></div>`;

  h += snacksHtml();
  const sl = Object.values(S.salud), sAv = sl.filter(s => s.next ? daysTo(s.next) < 0 : (s.every && (!s.last || s.every + daysTo(s.last) <= 30))).length, sEnc = (S.areas.a_salud || {}).owner;
  h += feriadosHtml();
  h += `<details class="card fold" id="turnos"><summary><span class="fic">${ic('salud')}</span><span class="ft"><b>Turnos médicos</b><small>${sl.length} especialidad${sl.length === 1 ? '' : 'es'}${sAv ? ` · <span class="tag w">${sAv} para revisar</span>` : ' · todo al día'}</small></span><span class="chev" aria-hidden="true">›</span></summary>
    <div class="row" style="margin:6px 0 4px">${sEnc ? `<span class="meta">Se encarga</span>${PB(sEnc, `A.cycleArea('a_salud')`)}` : '<span></span>'}<button class="b sm" onclick="A.saludForm()" aria-label="Agregar un control de salud">+ Control</button></div>
    ${Object.keys(S.salud).length ? '' : empty('salud', 'Sin controles cargados', 'Agregá pediatra, dentista u oculista para que la app avise cuándo sacar turno.', '', true)}
    ${Object.values(S.salud).sort((a,b) => a.name.localeCompare(b.name)).map(s => {
      let tag = '';
      if(s.next){ const k = daysTo(s.next); tag = k < 0 ? `<span class="tag b">ya pasó el turno: cargá el nuevo</span>` : `<span class="tag">turno ${fdate(s.next)}</span>`; }
      else if(s.every){ if(!s.last) tag = '<span class="tag w">cargá el último control</span>'; else { const k = s.every + daysTo(s.last); tag = k <= 30 ? `<span class="tag w">${k < 0 ? 'ya toca sacar turno' : 'sacar turno'}</span>` : `<span class="tag">al día</span>`; } }
      return `<div class="item"><div class="t" onclick="A.saludForm('${s.id}')" ${KB} aria-label="Editar ${esc(s.name)}"><div>${esc(s.name)}</div><div class="meta">${s.last ? 'último ' + fdate(s.last) + ' · ' : ''}${tag} ${esc(s.note || '')}</div></div>${P(s.owner)}</div>`;
    }).join('')}</details>`;
  return h;
}

  const tabs = me === 'daniela'

  if(!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  if(tab === 'chat') try { localStorage.setItem(LS.read, String(Date.now())); } catch(e) {}
  ringAnim = tab !== lastTab; lastTab = tab;
  const bd = badges(), nav = $('#nav');
  $('#navbtns').innerHTML = tabs.map(([k, i, l]) => { const n = k === tab && k === 'chat' ? 0 : bd[k] || 0;

  nav.style.setProperty('--n', tabs.length); nav.style.setProperty('--i', Math.max(0, tabs.findIndex(t => t[0] === tab)));
  const FAB = {hoy:['Sumar algo', () => A.fab()], compras:['Anotar un producto', () => A.itemForm(null, storeFilter !== 'todos' ? storeFilter : 'super')], casa:['Nueva tarea', () => A.taskForm()], joaco:['Nuevo control de salud', () => A.saludForm()]};
  const fa = me && me !== 'daniela' ? FAB[tab] : null, fb = $('#fab'); fb.hidden = !fa;
  if(fa){ fb.innerHTML = ic('mas'); fb.setAttribute('aria-label', fa[0]); fb.title = fa[0]; fb.onclick = fa[1]; }
  $('#who').innerHTML = me ? `${AV(me)}${esc(pm(me).n)}${ic('ajustes')}` : ic('ajustes'); $('#who').classList.toggle('solo', !me);
  const typing = document.activeElement && ['chatin','in_tarea','in_comida','buscar'].includes(document.activeElement.id) ? {id:document.activeElement.id, v:document.activeElement.value} : null;

/* Hojas modales: se cierran tirando hacia abajo (si la hoja está arriba de todo). */
function swipeSheet(){
  const box = $('#sheetbox'), modal = $('#modal'); let y0 = null, dy = 0, t0 = 0;
  box.addEventListener('touchstart', e => {
    const tg = e.target; if(e.touches.length !== 1 || box.scrollTop > 0 || (tg.closest && tg.closest('textarea,select,input[type=range],.chips'))) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now();
  }, {passive:true});
  box.addEventListener('touchmove', e => {
    if(y0 === null) return; dy = e.touches[0].clientY - y0;
    if(dy <= 0){ box.style.transform = ''; box.classList.remove('drag'); return; }
    if(e.cancelable) e.preventDefault();
    box.classList.add('drag'); box.style.transform = `translateY(${dy}px)`;
    modal.style.backgroundColor = `rgba(0,0,0,${Math.max(0, .45 - dy/900)})`;
  }, {passive:false});
  const end = () => {
    if(y0 === null) return; y0 = null; box.classList.remove('drag');
    const fast = dy > 40 && dy / Math.max(1, Date.now() - t0) > .6;
    if(dy > Math.min(140, box.offsetHeight * .3) || fast){
      box.classList.add('back'); box.style.transform = 'translateY(100%)'; buzz(10);
      setTimeout(() => A.close(), 200);
    } else if(dy > 0){ box.classList.add('back'); box.style.transform = ''; modal.style.backgroundColor = ''; setTimeout(() => box.classList.remove('back'), 240); }
    dy = 0;
  };
  box.addEventListener('touchend', end); box.addEventListener('touchcancel', end);
}

/* ============ Arranque ============ */
(function boot(){
  const tm = location.hash.match(/#tel=(.+)/);
  if(tm){ try{ const t = JSON.parse(decodeURIComponent(escape(atob(tm[1])))); const o = {}; ['gonzalo','dani','daniela'].forEach(p => { const v = normTel(t[p]); if(v) o[p] = v; }); localStorage.setItem(LS.tel, JSON.stringify(o)); setTimeout(() => toast('Teléfonos cargados'), 600); }catch(e){} history.replaceState(null, '', location.pathname); }
  const m = location.hash.match(/#join=(.+)/);
  if(m){
    try { const j = JSON.parse(decodeURIComponent(escape(atob(m[1])))); localStorage.setItem(LS.cfg, JSON.stringify(j.c)); localStorage.setItem(LS.code, j.h); S = seed(); S._v = SCHEMA; save(); } catch(e) { console.warn(e); }
    history.replaceState(null, '', location.pathname);
  }
  // Accesos directos del ícono (manifest shortcuts): ?go=hoy | chat | anotar
  const go = new URLSearchParams(location.search).get('go');
  if(go){
    if(['hoy','compras','casa','joaco','chat'].includes(go)) tab = go;
    if(go === 'anotar') tab = 'compras';
    history.replaceState(null, '', location.pathname);
  }
  try { if(!localStorage.getItem(LS.read)) localStorage.setItem(LS.read, String(Date.now())); } catch(e) {}
  applyTheme(); applyBig();
  render();
  swipeSheet();
  addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#modal').classList.contains('hidden')) A.close(); });
  if(go === 'anotar' && me && me !== 'daniela') setTimeout(() => A.itemForm(null, storeFilter !== 'todos' ? storeFilter : 'super'), 200);
  else setTimeout(maybeNews, 1600);
  setTimeout(() => { const sp = $('#splash'); sp.classList.add('out'); setTimeout(() => sp.remove(), 600); }, 1400);
  if(!me) A.open(`<div class="welcome"><img src="cover.jpg" alt=""></div><h3>¡Bienvenido/a! 🏡</h3><p class="muted">Para que se vea quién hace qué, elegí quién usa este teléfono:</p>
    ${['gonzalo','dani','daniela'].map(p => `<button class="b" style="display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;text-align:left;min-height:52px" onclick="A.setMe('${p}')">${AV(p)}<span><b>${M[p].n}</b> — ${M[p].r}</span></button>`).join('')}`);
  connect();
  addEventListener('online', renderSync); addEventListener('offline', renderSync);
  setInterval(() => { if(!document.querySelector('#modal:not(.hidden)') && !(document.activeElement && document.activeElement.tagName === 'INPUT')) render(); }, 60000);
  if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
